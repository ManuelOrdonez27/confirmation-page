<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gracias!</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Meow+Script&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Afacad+Flux:wght@100..1000&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&family=Spicy+Rice&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

  
  <link rel="stylesheet" href="style.css" />
</head>
  <div>
<body>
  <img src="assets/luciana-removebg-preview.png" alt="Logo" width="300">
    <br>
    <img src="assets/cake.png" alt="Logo" width="300" height="300">
    <br>
  <h3>Asistencia confirmada</h3>

  <h2 class="guest-name" id="guest-name">Loading...</h2>
  
   <!-- Image -->
  <img src="assets/Cinnamoroll.png" alt="Logo" width="150">

   <!-- QR Code -->
   <p style= "margin-bottom: 0px">Gracias por confirmar tu asistencia</p>
    
   <p style= "margin-top: 0px">¡Te espero el sábado 20 para divertirnos juntos 😁🎉!</p>

  <img src="assets/logooo.png" alt="Logo" height="300" width="300"> 
  <br>
  

  <script>
    // Extract the name from the URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const guestName = urlParams.get('name');

    // Display the guest's name
    if (guestName) {
      document.getElementById('guest-name').textContent = '¡Hola ' + guestName + ' 😀!';

      // Generate and display the QR code using a free API
      const qrCodeUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=' + encodeURIComponent(guestName);
      document.getElementById('qr-code').src = qrCodeUrl;
    } else {
      document.getElementById('guest-name').textContent = 'Guest';
      document.getElementById('qr-code').alt = 'No QR Code available';
    }
  </script>
</body>
    </div>
</head>
</html>
