<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
<title>Confirmación - Luciana</title>
<link rel="stylesheet" href="style.css" />
</head>
<body class="page">
<div class="container main-box neon-glow">
<header class="header">
<img src="assets/logoooooo.png" alt="Logo" class="logo" />


<div class="image-row fade-in">
<img src="assets/LUCIANA-26-11-2025.png" alt="Luciana" class="hero" />
<img src="assets/descarga (2).png" alt="Icon" class="icon" />
</div>


<img src="assets/hunntrixx.png" alt="Brand" class="brand fade-in" />
</header>


<main>
<h3 class="title fade-in floating">✨ Ingresa los siguientes datos para confirmar tu asistencia 🎉🎈</h3>


<form id="guest-form" class="form" aria-label="Formulario de confirmación">
<label for="name">Nombre:</label>
<input type="text" id="name" name="name" placeholder="Ingrese su nombre ✍" pattern="[A-Za-zÀ-ÖØ-öø-ÿ\s]+" required />


<label for="guests-number">Número de personas que asistirán:</label>
<input type="number" id="guests-number" name="guests-number" placeholder="Ingrese núm. de personas 👥" min="1" max="5" required />


<div class="controls">
<button id="submitButton" class="button" type="submit">Enviar 🚀</button>
</div>


<!-- Animated loader (hidden initially) -->
<div id="loader" class="loader hidden" role="status" aria-live="polite">
<div class="pixel-spinner">
<span></span><span></span><span></span>
</div>
<p class="sr-only">Enviando...</p>
</div>


<p id="message" class="message" aria-live="polite"></p>
</form>
<img src="assets\footer-removebg-preview.png" alt="Logo" class="logo fade-in floating" />
</main>

<img src="assets\footer-removebg-preview.png" alt="Logo" class="logo fade-in floating" />

<footer class="footer">
<p class="credits">Sitio desarrollado por Manuel Ordoñez</p>
</footer>
</div>


<!-- Audio elements (drop your sound files in assets/) -->
<audio id="sfx-send" src="assets/sfx_send.mp3" preload="auto"></audio>
<audio id="sfx-success" src="assets/sfx_success.mp3" preload="auto"></audio>
<audio id="sfx-hover" src="assets/sfx_hover.mp3" preload="auto"></audio>


<script src="script.js"></script>
</body>
</html>
