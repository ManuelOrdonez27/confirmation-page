<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmación de Asistencia</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Meow+Script&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Afacad+Flux:wght@100..1000&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="main-box fade-in">

    <img src="assets/logoooooo.png" class="logo-top">

    <div class="image-row">
      <img src="assets/LUCIANA-26-11-2025.png" width="280">
      <img src="assets/descarga (2).png" width="100">
    </div>

    <img src="assets/hunntrixx.png" width="200" class="fade-in">

    <h3>✨ Ingresa tu nombre para confirmar tu asistencia 🎉🎈</h3>

    <form id="guest-form">

      <p>Nombre:</p>
      <input 
        type="text" 
        id="name" 
        name="name" 
        placeholder="Escribe tu nombre ✍️"
        pattern="[A-Za-zÀ-ÖØ-öø-ÿ\s]+"
        required
      >

      <p>Número de personas:</p>
      <input 
        type="number" 
        id="guests-number" 
        name="guests-number" 
        placeholder="¿Cuántos vienen? 👥" 
        min="1"
        required
      >

      <button id="submitButton" class="button" type="submit">
        Enviar 🚀
      </button>

      <!-- Loading Spinner -->
      <div id="loadingSpinner" class="spinner hidden"></div>
    </form>

    <img src="assets\footer-removebg-preview.png" width="150">
    <footer class="footer">
      <p class="credits">Sitio desarrollado por Manuel Ordoñez ✨</p>
      </footer>
      </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
